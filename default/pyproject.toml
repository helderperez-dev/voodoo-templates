[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voodoo-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["voodoo-framework>=2.8.2"]

[tool.setuptools]
# Folder-based routing: `app/` holds page modules and `public/` holds static
# assets. Neither is a distributable Python package, so disable flat-layout
# auto-discovery.
packages = []
