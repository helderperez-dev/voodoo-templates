[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voodoo-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["voodoo-framework>=1.18.0"]

[tool.setuptools]
# This is a Voodoo project: `main.py` is the entry point and the app code
# lives in the `app/` package (folder-based routing). Disable flat-layout
# auto-discovery so setuptools doesn't try to package it.
packages = []
