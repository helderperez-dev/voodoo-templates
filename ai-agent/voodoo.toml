[app]
name = "ai-agent"

# AI — zero-code provider setup (the framework resolves everything from here).
# ``provider = "openai"`` targets any OpenAI-compatible endpoint via
# ``base_url`` (DeepSeek, OpenRouter, Together, …). The API key interpolates
# from .env / the environment at load time.
[ai]
provider = "openai"
model = "${DEEPSEEK_MODEL:deepseek-v4-flash}"
base_url = "${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}"
api_key = "${DEEPSEEK_API_KEY}"

# Theme
# -----
# The project theme lives in `.voodoo/theme/`; with no ``preset`` set,
# Voodoo resolves `.voodoo/theme/theme.json` then falls back to the
# built-in default (near-black zinc surfaces, indigo accent).

[theme]

# Store-first durability
# ----------------------
# Chat history uses Voodoo's data layer (Chat/Message models). No provider
# override is required: Voodoo 2.7 stores application state in the default
# `.voodoo/application.vstore`. SQLite/PostgreSQL remain explicit adapters.
